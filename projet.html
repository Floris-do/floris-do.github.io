<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet | Portfolio Floris Doreau</title>
    <meta name="description" content="Détail d'un projet du portfolio de Floris Doreau.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!--Background-->
    <link rel="stylesheet" href="css/background.css">
    <!--Header-->
    <link rel="stylesheet" href="css/header.css">
    <script src="js/menu-header.js" defer></script>
    <!--Footer-->
    <link rel="stylesheet" href="css/footer.css">
    <!--Détail d'un projet-->
    <link rel="stylesheet" href="css/projet-detail.css">
    <script type="module" src="js/projets/projet-detail.js"></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <a href="index.html" id="logo">
          <img src="assets/images/logo.svg" alt="Portfolio de Floris Doreau">
        </a>

        <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">Menu <i class="fa-solid fa-bars" aria-hidden="true"></i></button>

        <nav id="menu">
          <a href="index.html#projets">Découvrir mes projets</a>
          <a href="index.html#presentation">Accueil</a>
          <div class="separation"></div>
          <a href="index.html#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- Projet affiché (rempli par js/projet-detail.js à partir de ?id=...) -->
      <article id="projet-detail" class="detail" hidden>
        <div class="detail-entete panneau-verre">
          <!-- Colonne de gauche : titre, résumé, boutons -->
          <div class="detail-entete-texte">
            <a class="detail-retour" href="index.html#projets"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Tous les projets</a>

            <p class="detail-compteur"><span data-champ="numero"></span> / <span data-champ="total"></span></p>
            <h1 data-champ="nom" tabindex="-1"></h1>
            <p class="detail-description" data-champ="description"></p>

            <div class="boutons">
              <a class="bouton bouton--principal" data-champ="site" href="#" target="_blank" rel="noopener noreferrer">Voir le site <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>
              <a class="bouton bouton--secondaire" data-champ="code" href="#" target="_blank" rel="noopener noreferrer">Voir le code</a>
            </div>
          </div>

          <!-- Colonne de droite : fiche du projet -->
          <div class="detail-fiche">
            <div class="detail-fiche-ligne" data-ligne="role">
              <p class="detail-etiquette">Rôle</p>
              <p class="detail-fiche-valeur" data-champ="role"></p>
            </div>
            <div class="detail-fiche-ligne" data-ligne="statut">
              <p class="detail-etiquette">Statut</p>
              <p class="detail-fiche-valeur" data-champ="statut"></p>
            </div>
            <div class="detail-fiche-ligne detail-technos">
              <p class="detail-etiquette">Technologies utilisées</p>
              <ul class="pastilles" data-champ="technos"></ul>
            </div>
          </div>
        </div>

        <!-- Carrousel d'images (masqué s'il n'y a aucune image) -->
        <section class="detail-carrousel panneau-verre" aria-roledescription="carrousel" aria-label="Captures du projet" hidden>
          <div class="detail-visionneuse">
            <div class="detail-piste" tabindex="0" aria-label="Images du projet. Flèches gauche et droite pour naviguer."></div>
            <button class="detail-fleche detail-fleche--prec" type="button" aria-label="Image précédente"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
            <button class="detail-fleche detail-fleche--suiv" type="button" aria-label="Image suivante"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
          </div>
          <div class="detail-carrousel-pied">
            <div class="detail-points"></div>
            <p class="detail-compteur" aria-live="polite"><span data-champ="image-numero"></span> / <span data-champ="image-total"></span></p>
          </div>
        </section>

        <!-- Paragraphes : explication, démarche, résultat… -->
        <div class="detail-texte panneau-verre" hidden></div>

        <!-- Choix d'un autre projet : <details> natif, la liste s'affiche dans le même panneau sans JavaScript -->
        <details class="detail-suite panneau-verre">
          <summary class="detail-suite-entete">
            <h2>Continuer la visite</h2>
            <span class="bouton bouton--principal">Choisir un autre projet <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></span>
          </summary>
          <ul id="detail-suite-liste" class="detail-suite-liste"></ul>
        </details>
      </article>

      <!-- Projet introuvable ou erreur de chargement -->
      <section id="projet-introuvable" class="detail-introuvable panneau-verre" hidden>
        <h1 data-champ="titre">Projet introuvable</h1>
        <p data-champ="message"></p>
        <div class="boutons">
          <a class="bouton bouton--principal" href="index.html#projets">Retour aux projets <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
        </div>
      </section>

      <noscript>
        <p class="detail-noscript panneau-verre">JavaScript est nécessaire pour afficher ce projet. <a href="index.html#projets">Retour aux projets</a></p>
      </noscript>

      <template id="detail-modele-section">
        <section class="detail-section">
          <h2></h2>
          <div class="detail-section-corps"></div>
        </section>
      </template>
      <template id="detail-modele-techno">
        <li></li>
      </template>
      <template id="detail-modele-slide">
        <figure class="detail-slide" role="group" aria-roledescription="diapositive">
          <img alt="" decoding="async" loading="lazy">
          <p class="detail-slide-vide" hidden>Image à venir</p>
          <figcaption hidden></figcaption>
        </figure>
      </template>
      <template id="detail-modele-lien">
        <li>
          <a class="detail-suite-lien">
            <span class="detail-suite-num"></span>
            <span class="detail-suite-nom"></span>
          </a>
        </li>
      </template>
    </main>

    <footer>
      <a href="mentions-legales.html">Mentions légales</a>
    </footer>
  </body>
</html>
