<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Floris Doreau</title>
    <meta name="description" content="Portfolio de Floris Doreau, développeur web passionné par les technologies modernes et l'expérience utilisateur.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!--Background-->
    <link rel="stylesheet" href="css/background.css">
    <!--Header-->
    <link rel="stylesheet" href="css/header.css">
    <script src="js/menu-header.js" defer></script>
    <!--Footer-->
    <link rel="stylesheet" href="css/footer.css">
    <!--Contact + EmailJS-->
    <link rel="stylesheet" href="css/contact.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
    <script src="js/contact.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <a href="." id="logo">
          <img src="assets/images/logo.svg" alt="Portfolio de Floris Doreau">
        </a>

        <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">Menu <i class="fa-solid fa-bars" aria-hidden="true"></i></button>

        <nav id="menu">
          <a href="">Découvrir mes projets</a>
          <a href="">Accueil</a>
          <div class="separation"></div>
          <a href="#author">Contact</a>
        </nav>
      </div>
    </header>
    <main>
      <section id="contact" class="contact">
        <h2>Me contacter</h2>

        <form id="contact-form" class="contact-form" novalidate>
          <div class="form-group">
            <label for="author">Auteur du message</label>
            <input type="text" id="author" name="author" placeholder="Votre nom/prénom ou entreprise" autocomplete="name" maxlength="100" required>
            <p class="form-error" id="author-error" role="alert"></p>
          </div>

          <div class="form-group">
            <label for="reply_to">Adresse e-mail</label>
            <input type="email" id="reply_to" name="reply_to" placeholder="exemple@contact.com" autocomplete="email" maxlength="150" required>
            <p class="form-error" id="reply_to-error" role="alert"></p>
          </div>

          <div class="form-group">
            <label for="subject">Sujet</label>
            <input type="text" id="subject" name="subject" maxlength="150" placeholder="Exemple : proposition de projet, collaboration…" required>
            <p class="form-error" id="subject-error" role="alert"></p>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" maxlength="3000" placeholder="Décrivez votre projet ou votre demande…" required></textarea>
            <p class="form-error" id="message-error" role="alert"></p>
          </div>

          <!-- Piège anti-robots (honeypot) : invisible pour les humains, ne pas supprimer -->
          <div class="hp" aria-hidden="true">
            <label for="website">Ne pas remplir ce champ</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <p class="form-notice">En envoyant ce message, vous acceptez que ces informations soient utilisées pour vous répondre. Voir les <a href="mentions-legales.html#donnees-personnelles">mentions légales</a>.</p>

          <button type="submit" id="submit-btn" class="form-submit">Envoyer</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    
    <footer>
      <a href="mentions-legales.html">Mentions légales</a>
    </footer>
  </body>
</html>
